[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-ceiling"
version = "1.0.0"
description = "Fold-safe ensembling and a Darwin-Cage residual search for tabular competitions (Kaggle Playground S6E9)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Francisco Angulo de Lafuente" }]
requires-python = ">=3.10"
keywords = ["kaggle", "tabular", "ensembling", "target-encoding", "out-of-fold", "genetic-search", "negative-results"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=12"]

[project.optional-dependencies]
gbdt = ["lightgbm>=4.0", "xgboost>=2.0"]
test = ["pytest>=7", "lightgbm>=4.0", "xgboost>=2.0"]

[project.scripts]
honest-ceiling = "honest_ceiling.cli:main"

[project.urls]
Homepage = "https://github.com/Agnuxo1/s6e9-honest-ceiling"
Competition = "https://www.kaggle.com/competitions/playground-series-s6e9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
